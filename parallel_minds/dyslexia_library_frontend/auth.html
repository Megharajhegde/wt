<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadApt - Join the Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5b5ce2;
            --primary-dark: #4546c8;
            --bg-color: #f3f5ff;
            --text-color: #20223a;
            --muted-color: #777b96;
            --border-color: #e3e6f2;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Lexend', sans-serif;
            background:
                radial-gradient(circle at 12% 15%, rgba(116, 119, 255, .18), transparent 30%),
                radial-gradient(circle at 90% 85%, rgba(81, 204, 190, .18), transparent 28%),
                var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            color: var(--text-color);
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            z-index: -1;
            border-radius: 50%;
            filter: blur(1px);
            pointer-events: none;
        }
        body::before {
            width: 230px; height: 230px;
            background: linear-gradient(135deg, rgba(109, 111, 255, .17), rgba(109, 111, 255, .02));
            top: 7%; right: 8%;
        }
        body::after {
            width: 170px; height: 170px;
            background: linear-gradient(135deg, rgba(64, 190, 177, .16), rgba(64, 190, 177, .02));
            bottom: 5%; left: 7%;
        }


        /* Static abstract SVG artwork behind the auth card */
        .ambient-art {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .ambient-art .orbit {
            fill: none;
            stroke: rgba(100, 104, 230, .18);
            stroke-width: 1.2;
        }
        .ambient-art .spark {
            fill: #777bf1;
            opacity: .45;
        }
        @media (prefers-reduced-motion: reduce) {
            .auth-container { animation: none; }
        }

        .auth-container {
            background: rgba(255, 255, 255, .94);
            padding: 38px 40px 32px;
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(50, 55, 120, .13), 0 3px 10px rgba(50, 55, 120, .04);
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
            animation: card-enter .45s ease-out both;
        }
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, #6869f0, #54cdbb, #8b7bfa);
        }
        @keyframes card-enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            height: 64px;
            max-width: 180px;
            object-fit: contain;
            margin: 0 auto 20px;
            border-radius: 12px;
            display: block;
        }

        h2 {
            color: #20223a;
            margin: 0;
            text-align: center;
            font-size: clamp(1.7rem, 5vw, 2rem);
            line-height: 1.25;
            letter-spacing: -.7px;
            font-weight: 500;
        }
        p.subtitle {
            text-align: center;
            color: var(--muted-color);
            margin: 10px 0 28px;
            font-size: .93rem;
            line-height: 1.6;
        }

        .input-group { margin-bottom: 19px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #393c58;
            font-size: .86rem;
        }
        .password-wrapper { position: relative; display: flex; align-items: center; }
        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Lexend', sans-serif;
            color: var(--text-color);
            background: #fbfcff;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        input::placeholder { color: #a5a8bc; }
        input[type="password"], input#password { padding-right: 48px; }
        input:hover { border-color: #c9ccef; }
        input:focus {
            outline: none;
            background: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(91, 92, 226, .12);
        }
        .toggle-password-btn {
            position: absolute;
            right: 9px;
            background: transparent;
            border: 0;
            border-radius: 8px;
            color: #777b96;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 7px;
            line-height: 1;
            transition: background .2s, color .2s;
        }
        .toggle-password-btn:hover { color: var(--primary-color); background: #f0f0ff; }

        button.primary-submit {
            width: 100%;
            padding: 15px 18px;
            margin-top: 3px;
            background: linear-gradient(135deg, #6869ed, #5354d5);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Lexend', sans-serif;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 8px 18px rgba(91, 92, 226, .22);
            transition: transform .18s, box-shadow .18s, filter .18s;
        }
        button.primary-submit:hover { filter: brightness(1.04); box-shadow: 0 11px 23px rgba(91, 92, 226, .28); transform: translateY(-1px); }
        button.primary-submit:active { transform: translateY(0); }
        button.primary-submit:disabled { background: #b8b9d6; box-shadow: none; cursor: not-allowed; transform: none; }

        .toggle-link {
            text-align: center;
            margin-top: 23px;
            font-size: .88rem;
            color: var(--muted-color);
            line-height: 1.7;
        }
        .toggle-link a {
            color: var(--primary-color);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            margin-left: 3px;
        }
        .toggle-link a:hover { color: var(--primary-dark); text-decoration: underline; }
        .guest-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: .86rem;
            color: #8589a2;
            text-decoration: none;
            transition: color .2s;
        }
        .guest-link:hover { color: var(--primary-dark); text-decoration: underline; }

        #error-msg {
            color: #a72e45;
            background: #fff0f2;
            border: 1px solid #ffd5dc;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 480px) {
            body { padding: 18px 12px; }
            .auth-container { padding: 32px 23px 26px; border-radius: 20px; }
            .auth-logo { height: 56px; margin-bottom: 17px; }
            p.subtitle { margin-bottom: 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="auth-container">
    <img src="logo3.png" alt="ReadApt Logo" class="auth-logo" onerror="this.style.display='none'">
    
    <h2 id="auth-title">Welcome Back</h2>
    <p class="subtitle" id="auth-subtitle">Login to access your personal library.</p>
    
    <div id="error-msg"></div>
    
    <div id="name-group" class="input-group" style="display: none;">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="E.g., Jane Doe">
    </div>

    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="input-group">
        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••">
            <button type="button" class="toggle-password-btn" onclick="togglePassword()" aria-label="Show password" title="Show password">
                👁️
            </button>
        </div>
    </div>

    <button id="auth-btn" class="primary-submit" onclick="handleAuth()">Login</button>

    <div class="toggle-link">
        <span id="toggle-text">Don't have an account?</span> 
        <a id="toggle-action" onclick="toggleAuthMode()">Create one here</a>
    </div>

    <a href="index.html" class="guest-link">Skip and continue as Guest →</a>
</div>

<script>
    let isLogin = true;

    // --- Show/Hide Password Logic ---
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.toggle-password-btn');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.innerText = '🔒'; // Change icon to a locked padlock when visible
            toggleBtn.setAttribute('title', 'Hide password');
        } else {
            passwordInput.type = 'password';
            toggleBtn.innerText = '👁️'; // Change icon back to eye when hidden
            toggleBtn.setAttribute('title', 'Show password');
        }
    }

    // --- 1. Toggle Between Login and Register UI ---
    function toggleAuthMode() {
        isLogin = !isLogin;
        
        // Update text for Register Mode
        document.getElementById('auth-title').innerText = isLogin ? 'Welcome Back' : 'Create Account';
        document.getElementById('auth-subtitle').innerText = isLogin ? 'Login to access your personal library.' : 'Sign up to upload your own PDFs.';
        document.getElementById('auth-btn').innerText = isLogin ? 'Login' : 'Sign Up';
        
        // Update Toggle Link
        document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
        document.getElementById('toggle-action').innerText = isLogin ? 'Create one here' : 'Login here';
        
        // Show/Hide Name Field
        document.getElementById('name-group').style.display = isLogin ? 'none' : 'block';
        
        // Clear errors
        document.getElementById('error-msg').style.display = 'none';
    }

    // --- 2. Handle the Form Submission to Flask Backend ---
    async function handleAuth() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const name = document.getElementById('name').value.trim();
        const errorDiv = document.getElementById('error-msg');
        const btn = document.getElementById('auth-btn');

        // Basic Validation
        if (!email || !password || (!isLogin && !name)) {
            errorDiv.innerText = "Please fill in all required fields.";
            errorDiv.style.display = 'block';
            return;
        }
        const emailInput = document.getElementById('email');

        if (!emailInput.checkValidity()) {
            errorDiv.innerText = "Please enter a valid email address, e.g. user@example.com";
            errorDiv.style.display = 'block';
            return;
        }

        // Determine which API endpoint to hit
        const endpoint = isLogin ? '/login' : '/register';
        const body = isLogin ? { email, password } : { name, email, password };

        // UI Loading State
        btn.disabled = true;
        btn.innerText = "Connecting...";
        errorDiv.style.display = 'none';

        try {
            const response = await fetch(`http://127.0.0.1:5000/api${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (response.ok) {
                // SUCCESS: Save user to localStorage
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'index.html'; 
            } else {
                // FAILED: Show the error message from Flask
                errorDiv.innerText = data.error || "Authentication failed.";
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.innerText = "Cannot connect to server. Is Flask running?";
            errorDiv.style.display = 'block';
        } finally {
            // Reset UI State
            btn.disabled = false;
            btn.innerText = isLogin ? 'Login' : 'Sign Up';
        }
    }

    // Add "Enter Key" support for quick login
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleAuth();
        }
    });
</script>

<svg class="ambient-art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
        <linearGradient id="abyssWave" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7779f6" stop-opacity=".15"/>
            <stop offset="1" stop-color="#57cfc0" stop-opacity=".08"/>
        </linearGradient>
        <radialGradient id="abyssGlow">
            <stop offset="0" stop-color="#8b8dff" stop-opacity=".22"/>
            <stop offset="1" stop-color="#8b8dff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="abyssLine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#777bf1" stop-opacity=".18"/>
            <stop offset="1" stop-color="#4bc6b8" stop-opacity=".1"/>
        </linearGradient>
    </defs>
    <circle cx="170" cy="170" r="250" fill="url(#abyssGlow)"/>
    <circle cx="1280" cy="720" r="320" fill="url(#abyssGlow)"/>
    <path d="M-80 650 C180 490 270 850 520 690 S900 500 1110 660 S1370 850 1530 660 L1530 980 L-80 980Z" fill="url(#abyssWave)"/>
    <path d="M-60 700 C190 540 300 880 540 730 S910 550 1120 700 S1380 880 1510 710" fill="none" stroke="url(#abyssLine)" stroke-width="2"/>
    <path d="M-60 740 C190 580 300 920 540 770 S910 590 1120 740 S1380 920 1510 750" fill="none" stroke="url(#abyssLine)" stroke-width="1.5"/>
    <circle class="orbit" cx="180" cy="720" r="105"/>
    <circle class="orbit" cx="180" cy="720" r="135"/>
    <circle class="orbit" cx="1260" cy="185" r="95"/>
    <circle class="orbit" cx="1260" cy="185" r="125"/>
    <circle class="spark" cx="180" cy="585" r="3"/>
    <circle class="spark" cx="315" cy="720" r="2.5"/>
    <circle class="spark" cx="1260" cy="60" r="3"/>
    <circle class="spark" cx="1385" cy="185" r="2.5"/>
    <path d="M80 250 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6Z" fill="#777bf1" opacity=".25"/>
    <path d="M1330 470 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5Z" fill="#54cdbb" opacity=".3"/>
</svg>

</body>
</html>
